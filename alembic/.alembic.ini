[alembic]
# Path to migration scripts
script_location = alembic

# Template for new migration files
# default: generic file with revision id
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Logging configuration
# (Optional: leave as default)
# log_file = alembic.log
# log_level = INFO

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

# ----------------------------
# Database URL
# We will use DATABASE_URL from environment variable
# Leave this blank here; env.py will set it dynamically
sqlalchemy.url = 

